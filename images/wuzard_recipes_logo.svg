<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 90" width="100%" height="100%">
  <g transform="translate(10, 5)">
    <!-- Custom Vector Mark -->
    <svg width="80" height="80" viewBox="0 0 100 100">

        <!-- Celtic/Runic Border frame -->
        <circle cx="50" cy="50" r="43" stroke="#FFA800" stroke-width="0.8" stroke-dasharray="2 4" fill="none" opacity="0.8" />
        <circle cx="50" cy="50" r="40" stroke="#FF7614" stroke-width="0.5" opacity="0.3" fill="none" />
        
        <!-- Open Pages -->
        <!-- Left Page -->
        <path d="M 48 31 C 41 31, 25 26, 20 32 V 64 C 25 58, 41 62, 48 62 Z" fill="#FF7614" fill-opacity="0.1" stroke="#FF7614" stroke-width="2" stroke-linejoin="round" />
        <!-- Right Page -->
        <path d="M 52 31 C 59 31, 75 26, 80 32 V 64 C 75 58, 59 62, 52 62 Z" fill="#FF7614" fill-opacity="0.1" stroke="#FF7614" stroke-width="2" stroke-linejoin="round" />
        
        <!-- Book spine -->
        <path d="M 50 28 V 66" stroke="#FFA800" stroke-width="3" stroke-linecap="round" />
        
        <!-- Book bookmark ribbon -->
        <path d="M 50 64 Q 48 76, 42 78" stroke="#FFA800" stroke-width="2" fill="none" stroke-linecap="round" />
        
        <!-- Magic glyph on Left page: Crescent Moon -->
        <path d="M 31 43 A 3.5,3.5 0 1,1 31 51 A 2.5,2.5 0 1,0 31 43" fill="#FFA800" />
        
        <!-- Magic glyph on Right page: Radiant Star -->
        <path d="M 69 43 L 70.2 46 L 73 47 L 70.2 48 L 69 51 L 67.8 48 L 65 47 L 67.8 46 Z" fill="#FFA800" />
        
        <!-- Sparks/Magic rising from cauldron book -->
        <path d="M 50 24 L 50 14" stroke="#FF7614" stroke-width="1.6" stroke-dasharray="1 2" stroke-linecap="round" />
        <polygon points="50,6 52.5,10 50,12 47.5,10" fill="#FFA800" />
        <circle cx="34" cy="21" r="1.5" fill="#FFA800" />
        <circle cx="66" cy="21" r="1.5" fill="#FF7614" />
          </svg>
  </g>
  <!-- Brand Typography -->
  <text x="102" y="43" fill="#FF7614" font-family="'Cinzel', 'Georgia', 'Playfair Display', serif" font-size="19" font-weight="800" letter-spacing="1">WUZARD'S BREWS</text>
  <text x="103" y="59" fill="#FFA800" font-family="'Cinzel', 'Georgia', 'Playfair Display', serif" font-size="8.5" opacity="0.8" font-weight="500" letter-spacing="1.5">POTION BREWING CO.</text>
</svg>